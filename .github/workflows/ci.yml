# Every push and PR: shared (tests + fresh-build check), backend (typecheck + tests), frontend (lint + build),
# and a dependency audit. Keeps `main` runnable (AGENTS.md rule 7).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            contracts/package-lock.json
      - name: contracts (compile + backend ABI in sync)
        working-directory: contracts
        run: |
          npm ci
          node deploy.js --write-abi
          git diff --exit-code -- ../backend/abi || (echo "backend/abi is stale: run 'node deploy.js --write-abi' in contracts/" && exit 1)
      - name: shared
        working-directory: shared
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: audit (high+)
        run: |
          (cd shared && npm audit --audit-level=high)
          (cd backend && npm audit --audit-level=high)
          (cd contracts && npm audit --audit-level=high)

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: |
          docker build -f backend/Dockerfile -t kx-backend .
          docker build -t kx-frontend --build-arg NEXT_PUBLIC_API_URL=https://api.example.com frontend
      - name: smoke test
        run: |
          # production backend must refuse to start without a real config
          if docker run --rm kx-backend; then echo "backend started with an empty production config" && exit 1; fi
          # dev-mode backend and the frontend must serve
          # dev mode with format-only addresses and an unreachable RPC: the smoke test must not depend on MST testnet
          docker run -d --name be -p 5000:5000 -e NODE_ENV=development \
            -e MST_RPC_URL=http://127.0.0.1:9 -e MST_WS_URL=ws://127.0.0.1:9 \
            -e ESCROW_ADDRESS=0x000000000000000000000000000000000000dEaD -e USD_ADDRESS=0x000000000000000000000000000000000000bEEF \
            kx-backend
          docker run -d --name fe -p 3000:3000 kx-frontend
          # /drafts answers 401 without the chain (unlike /health, which reads the MST RPC)
          for i in $(seq 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:5000/drafts)" = 401 ] && curl -sf -o /dev/null localhost:3000/ && exit 0
            sleep 2
          done
          docker logs be; docker logs fe; exit 1
