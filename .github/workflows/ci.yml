# Every push and PR: shared (tests + fresh-build check), backend (typecheck + tests), frontend (lint + build),
# and a dependency audit. Keeps `main` runnable (AGENTS.md rule 7).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            backend/package-lock.json
            contracts/package-lock.json
      - name: contracts (compile)
        working-directory: contracts
        run: |
          npm ci
          npm run compile
      - name: shared
        working-directory: shared
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: backend
        working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: audit (high+)
        run: |
          (cd shared && npm audit --audit-level=high)
          (cd backend && npm audit --audit-level=high)
          (cd contracts && npm audit --audit-level=high)

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      - run: npm audit --audit-level=high
